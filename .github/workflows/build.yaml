name: build

on:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        name: Setup Flutter
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run Tests
        run: flutter test --reporter expanded

  build:
    name: Build
    needs: [ test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          submodules: recursive

      - if: startsWith(matrix.platform, 'android')
        name: Free Disk Space
        run: |
          sudo apt-get clean
          docker system prune -af --volumes 2>/dev/null || true
          rm -rf ~/.gradle/caches/

      - if: startsWith(matrix.platform, 'android')
        name: Setup Android Signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.26.5'

      - uses: subosito/flutter-action@v2
        name: Setup Flutter
        with:
          channel: ${{ (startsWith(matrix.os, 'windows-11-arm') || startsWith(matrix.os, 'ubuntu-24.04-arm')) && 'master' || 'stable' }}
          flutter-version: '3.44.4'
          cache: true

      - if: startsWith(matrix.platform, 'android')
        uses: nttld/setup-ndk@v1
        name: Setup NDK
        with:
          ndk-version: r28c

      - name: Setup Environment
        run: |
          # Pre-add pub cache to PATH so setup.dart can find flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          # Git longpaths — Windows
          if [ "${{ runner.os }}" = "Windows" ]; then
            git config --global core.longpaths true
          fi
          # apt retry — Linux only, mitigates ports.ubuntu.com transient failures
          if [ "${{ runner.os }}" = "Linux" ]; then
            printf '%s\n' \
              'Acquire::Retries "3";' \
              'Acquire::http::Timeout "30";' \
              'Acquire::https::Timeout "30";' \
              | sudo tee /etc/apt/apt.conf.d/99retry >/dev/null
          fi

      - if: startsWith(matrix.os, 'windows-11-arm')
        name: Setup Rust
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Install Dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build Artifacts
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Normalize Artifacts
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          find ./dist -type f -exec mv {} ./dist/ \; 2>/dev/null || true
          if [ "${{ matrix.platform }}" = "android" ]; then
            for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
              [ -f "$apk" ] || continue
              abi=$(basename "$apk" | sed 's/app-\(.*\)-release.apk/\1/')
              cp "$apk" "./dist/FlClash-${version}-android-${abi}.apk"
            done
          fi
          if [ -n "${{ matrix.arch }}" ]; then
            arch="${{ matrix.arch }}"
            for ext in AppImage deb rpm; do
              for f in ./dist/FlClash-*-linux*.$ext; do
                [ -f "$f" ] && mv "$f" "./dist/FlClash-${version}-linux-${arch}.${ext}"
              done
            done
            for f in ./dist/FlClash-*-windows-setup.exe; do
              [ -f "$f" ] && mv "$f" "./dist/FlClash-${version}-windows-${arch}-setup.exe"
            done
            for f in ./dist/FlClash-*-windows.zip; do
              [ -f "$f" ] && mv "$f" "./dist/FlClash-${version}-windows-${arch}.zip"
            done
            for f in ./dist/FlClash-*-macos.dmg; do
              [ -f "$f" ] && mv "$f" "./dist/FlClash-${version}-macos-${arch}.dmg"
            done
          fi
          find ./dist -type d -empty -delete 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        name: Upload
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  release:
    name: Release
    needs: [ build ]
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        name: Checkout
        with:
          fetch-depth: 0
          ref: refs/heads/main

      - uses: actions/download-artifact@v4
        name: Download Artifacts
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Update Changelog
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          ls ./dist/

          # --- CHANGELOG ---
          last_ver=$(grep -m1 '^## ' CHANGELOG.md 2>/dev/null | sed 's/^## //')
          tags=($(git tag --merged HEAD --sort=-creatordate))
          temp="NEW_CHANGELOG.md"
          : > "$temp"
          for i in "${!tags[@]}"; do
            curr="${tags[i]}"
            [[ "$curr" == "$last_ver" ]] && break
            prev="${tags[i+1]}"
            range="${prev:+$prev..}$curr"
            echo -e "## $curr\n" >> "$temp"
            git log --no-merges --pretty=format:"%s" "$range" | \
              awk -f ./scripts/group-commits.awk -v heading_prefix="###" >> "$temp"
            echo "" >> "$temp"
          done
          [ -f CHANGELOG.md ] && cat CHANGELOG.md >> "$temp"
          mv "$temp" CHANGELOG.md

          # --- Release body ---
          out="release.md"
          sed "s|VERSION|$version|g" ./.github/release_template.md > "$out"
          echo "" >> "$out"
          tags=($(git tag --merged HEAD --sort=-creatordate))
          preTag=$(curl -s "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" | \
            sed -nE 's/.*"tag_name": "([^"]+)".*/\1/p')
          [ -z "$preTag" ] && preTag="${tags[0]}"
          for i in "${!tags[@]}"; do
            curr="${tags[i]}"
            prev="${tags[i+1]}"
            range="${prev:+$prev..}$curr"
            git log --no-merges --pretty=format:"%s" "$range" | \
              awk -f ./scripts/group-commits.awk -v heading_prefix="##" >> "$out"
            [[ "$curr" == "$preTag" ]] && break
          done

          # --- SHA256SUMS ---
          cd ./dist
          find . -type f -exec sha256sum {} \; > SHA256SUMS
          cd ..

          # --- GitHub Release ---
          gh release create "${{ github.ref_name }}" ./dist/* \
            --notes-file release.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            git config --local user.email "eykettle@tutamail.com"
            git config --local user.name "EyKettle"
            git commit -m "chore(release): bump version to ${version}"
            git push origin main
          fi

  push:
    name: Push
    needs: [ release ]
    if: ${{ !contains(github.ref, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        name: Checkout

      - name: Dispatch Action
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_FDROID }}
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          gh api -X POST \
            repos/${{ github.repository_owner }}/FlClash-fdroid-repo/actions/workflows/deploy.yml/dispatches \
            -f ref=main \
            -f "inputs[version]=${version}"
